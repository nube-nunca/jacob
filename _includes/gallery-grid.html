<div class="container mx-auto px-4"> 
  <div class="js-masonry relative w-full -mx-2"> 
    <div class="masonry-sizer w-full sm:w-1/2 md:w-1/3 lg:w-1/4"></div> <!-- 🧱 반드시 첫 번째 child로 들어가야 함 --> 
    
    <!-- 🔄 This automatically pulls all photos from the architecture subfolder -->
    {% for file in site.static_files %}
      {% if file.path contains 'photoassets/architecture/' %}
        <div class="masonry-item w-full sm:w-1/2 md:w-1/3 lg:w-1/4 px-2 mb-4 break-inside-avoid box-border animate-fade-in"> 
          <a href="{{ file.path | relative_url }}" data-fancybox="gallery"> 
            <img src="{{ file.path | relative_url }}" alt="Architecture Photograph" loading="lazy" class="block w-full rounded-lg transition-transform duration-300 ease-in-out hover:scale-105 opacity-0 transition-opacity duration-500 ease-in" /> 
          </a> 
        </div> 
      {% endif %}
    {% endfor %}

  </div> 
</div> 

<script src="https://unpkg.com"></script> 
<script src="https://unpkg.com"></script> 
<script> 
  document.addEventListener("DOMContentLoaded", function() { 
    const grid = document.querySelector('.js-masonry'); 
    imagesLoaded(grid, function() { 
      new Masonry(grid, { 
        itemSelector: '.masonry-item', 
        columnWidth: '.masonry-sizer', 
        percentPosition: true 
      }); 
    }); 
  }); 
</script>
