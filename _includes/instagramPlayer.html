<div class="instagram-embed-card">
  <div class="instagram-embed">
  <blockquote
    class="instagram-media"
    data-instgrm-permalink="{{ include.url }}"
    data-instgrm-version="14"
    data-instgrm-captioned>
    </blockquote>
  </div>

  {% if include.caption %}
    <p class="instagram-caption">
      {{ include.caption }}
    </p>
  {% endif %}
</div>
